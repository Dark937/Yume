<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="/">
    <title>Yume | FAQ</title>
    <link rel="icon" href="assets/yume-light.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Nunito:ital,wght@0,400;0,700;0,900;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/legal.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="scripts/translations.js" defer></script>
    <script src="scripts/i18n.js" defer></script>
</head>

<body>
    <nav class="navbar nav-dark">
        <div class="nav-left">
            <a href="javascript:history.back()" class="btn-back-nav">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
        </div>

        <div class="nav-center">
            <a href="index" class="nav-logo-link">
                <img src="assets/yume-light-sakura.webp" alt="YUME" class="brand-logo logo-light">
                <img src="assets/yume-dark-sakura.webp" alt="YUME" class="brand-logo logo-dark">
            </a>
        </div>

        <div class="nav-right">
            <button class="btn-navbar-icon btn-yellow lang-toggle" id="lang-toggle">
                <span class="lang-toggle-text">IT</span>
            </button>
            <a href="#" class="btn-navbar-icon"><i class="fa-brands fa-instagram"></i></a>
            <a href="#" class="btn-navbar-icon"><i class="fa-brands fa-tiktok"></i></a>
        </div>
    </nav>

    <main class="legal-main">
        <header class="legal-hero" data-theme="light">
            <div class="legal-hero-inner">
                <h1 class="legal-title" data-i18n="faq.title">DOMANDE FREQUENTI</h1>
                <p class="legal-subtitle" data-i18n="faq.subtitle">Everything you need to know about the mission.</p>
                <div class="legal-date">SYNC: JAN 2026</div>
            </div>
        </header>

        <div class="legal-content" data-theme="dark">
            <aside class="legal-sidebar">
                <div class="legal-nav-title">INDEX</div>
                <nav class="legal-nav">
                    <a href="#q1" class="legal-nav-link" data-i18n="faq.q1.title">SHIPPING</a>
                    <a href="#q2" class="legal-nav-link" data-i18n="faq.q2.title">INGREDIENTS</a>
                    <a href="#q3" class="legal-nav-link" data-i18n="faq.q3.title">TRACKING</a>
                    <a href="#q4" class="legal-nav-link" data-i18n="faq.q4.title">CANCELLATIONS</a>
                </nav>
            </aside>

            <div class="legal-container">
                <section id="q1" class="legal-section">
                    <h2 data-i18n="faq.q1.title">Where do you ship?</h2>
                    <p data-i18n="faq.q1.text">...</p>
                </section>

                <section id="q2" class="legal-section">
                    <h2 data-i18n="faq.q2.title">Ingredients</h2>
                    <p data-i18n="faq.q2.text">...</p>
                </section>

                <section id="q3" class="legal-section">
                    <h2 data-i18n="faq.q3.title">Tracking</h2>
                    <p data-i18n="faq.q3.text">...</p>
                </section>

                <section id="q4" class="legal-section">
                    <h2 data-i18n="faq.q4.title">Cancellations</h2>
                    <p data-i18n="faq.q4.text">...</p>
                </section>
            </div>
        </div>
    </main>

    <footer class="footer-minimal footer-light">
        <div class="container">
            <img src="assets/yume-light-sakura.webp" alt="YUME" class="footer-logo">
            <p class="footer-rights" data-i18n="footer.rights">&copy; 2026 Yume Drinks. Anime-Inspired Energy. All rights reserved.</p>
        </div>
    </footer>

    <script src="scripts/navbar-theme.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const sections = document.querySelectorAll('.legal-section');
            const navLinks = document.querySelectorAll('.legal-nav-link');

            // Handle internal navigation for hash links when <base> is present
            document.querySelectorAll('a[href^="#"]').forEach(anchor => {
                anchor.addEventListener('click', function (e) {
                    e.preventDefault();
                    const targetId = this.getAttribute('href').substring(1);
                    const targetElement = document.getElementById(targetId);
                    if (targetElement) {
                        const offset = 100;
                        const elementPosition = targetElement.getBoundingClientRect().top;
                        const offsetPosition = elementPosition + window.pageYOffset - offset;

                        window.scrollTo({
                            top: offsetPosition,
                            behavior: 'smooth'
                        });
                        history.pushState(null, null, '#' + targetId);
                    }
                });
            });

            // Scroll-spy highlighting logic
            window.addEventListener('scroll', () => {
                let current = "";
                sections.forEach(section => {
                    const sectionTop = section.offsetTop;
                    if (pageYOffset >= sectionTop - 150) {
                        current = section.getAttribute('id');
                    }
                });

                navLinks.forEach(link => {
                    link.classList.remove('active');
                    if (link.getAttribute('href').includes(current) && current !== "") {
                        link.classList.add('active');
                    }
                });
            });
        });
    </script>
</body>

</html>
